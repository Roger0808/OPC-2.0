<svg xmlns="http://www.w3.org/2000/svg" width="400" height="126" viewBox="0 0 400 126">
  <defs>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Base dark slate: Inverts cleanly to pure crisp white on login page & dark mode -->
  <g fill="#111d2e">
    <!-- Letter O (The Iconic Segmented Ring Token): cx=113, cy=48, R=38, r=29.5 -->
    <!-- Left = 75, Right = 151 -->
    <g transform="translate(113, 48)">
      <!-- 4 Arc Segments with 4.5px slits -->
      <!-- Top Right -->
      <path d="M 4.5,-37.7 A 38 38 0 0 1 37.7,-4.5 L 29.3,-3.5 A 29.5 29.5 0 0 0 3.5,-29.3 Z" />
      <!-- Bottom Right -->
      <path d="M 37.7,4.5 A 38 38 0 0 1 4.5,37.7 L 3.5,29.3 A 29.5 29.5 0 0 0 29.3,3.5 Z" />
      <!-- Bottom Left -->
      <path d="M -4.5,37.7 A 38 38 0 0 1 -37.7,4.5 L -29.3,3.5 A 29.5 29.5 0 0 0 -3.5,29.3 Z" />
      <!-- Top Left -->
      <path d="M -37.7,-4.5 A 38 38 0 0 1 -4.5,-37.7 L -3.5,-29.3 A 29.5 29.5 0 0 0 -29.3,-3.5 Z" />
      
      <!-- Dynamic Core "1" in Golden Amber -->
      <polygon points="-3,-14 6,-14 2,14 -6.5,14 -4,2.5 -7.5,5.5 -10,1.5" fill="url(#goldRibbon)" />
    </g>

    <!-- Letter P: Left = 169 (Gap to O = 18px), Right = 233, Height 76 (y=10 to 86) -->
    <path d="M 169,10 L 206,10 C 224,10 233,21 233,37 C 233,53 224,63 206,63 L 177.5,63 L 177.5,86 L 169,86 Z M 177.5,18.5 L 177.5,54.5 L 205,54.5 C 218,54.5 224.5,47 224.5,37 C 224.5,27 218,18.5 205,18.5 Z" />

    <!-- Letter C: Left = 251 (Gap to P = 18px), Right = 327, Height 76 (y=10 to 86), cx=289, cy=48, R=38, r=29.5 -->
    <path d="M 321,28 C 313,16.5 301.5,10 289,10 C 268,10 251,27 251,48 C 251,69 268,86 289,86 C 301.5,86 313,79.5 321,68 L 314,62 C 307.5,70.5 298.5,77.5 289,77.5 C 272.7,77.5 259.5,64 259.5,48 C 259.5,32 272.7,18.5 289,18.5 C 298.5,18.5 307.5,25.5 314,34 Z" />
  </g>

  <!-- Signature Wave Underline: Perfectly centered and flowing under O-P-C -->
  <!-- Dark Wave Stroke: sweeps from x=72 to x=338 -->
  <path d="M 72,94 C 140,95 210,103 275,97 C 305,94 328,85 342,76 C 322,86 290,96 250,98 C 185,101 125,97 72,94 Z" fill="#111d2e" />
  
  <!-- Golden Ribbon Accent Stroke -->
  <path d="M 110,99.5 C 170,103.5 235,102 285,95 C 312,90.5 330,84 345,78 C 324,86 295,96 255,99 C 205,103 145,101.5 110,99.5 Z" fill="url(#goldRibbon)" />
</svg>